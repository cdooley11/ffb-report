<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Boys Club FFL - Transaction History Dashboard</title>
    <style>
  :root {
    --green-dark: #1a3a1a;
    --green-mid: #2d5a27;
    --green-field: #3a7d32;
    --green-light: #4e9e44;
    --gold: #f0c030;
    --silver: #c0c8d0;
    --white: #f5f5f0;
    --card-bg: rgba(10,30,10,0.72);
    --card-border: rgba(255,255,255,0.13);
    --blue-accent: #2980b9;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--green-dark);
    color: var(--white);
    min-height: 100vh;
    padding: 20px;
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent calc(10% - 1px), rgba(255,255,255,0.09) calc(10% - 1px), rgba(255,255,255,0.09) 10%),
      repeating-linear-gradient(180deg, transparent, transparent calc(8% - 1px), rgba(255,255,255,0.05) calc(8% - 1px), rgba(255,255,255,0.05) 8%),
      linear-gradient(160deg, #1a3a1a 0%, #2d5a27 40%, #1e4a1e 70%, #152a15 100%);
    background-attachment: fixed;
  }

  .container { max-width: 95%; margin: 0 auto; }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
    margin-bottom: 1.5rem;
  }
  header::before {
    content: '';
    display: block;
    width: 90%;
    max-width: 900px;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 1.5rem;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--gold);
    text-shadow: 0 2px 18px rgba(0,0,0,0.7), 0 0 40px rgba(240,192,48,0.25);
  }

  .subtitle {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    color: var(--silver);
    letter-spacing: 0.2em;
    margin-top: 0.5rem;
  }

  .team-selector {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    backdrop-filter: blur(6px);
    margin-bottom: 1.5rem;
  }

  .selector-label {
    font-family: 'Oswald', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  select {
    width: 100%;
    padding: 0.55rem 0.75rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    color: var(--white);
    cursor: pointer;
    transition: border-color 0.2s;
  }
  select:hover { border-color: rgba(240,192,48,0.5); }
  select:focus { outline: none; border-color: var(--gold); }
  select option { background: #1a3a1a; color: var(--white); }

  .status-msg {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--gold);
    border-radius: 6px;
    padding: 1.25rem 1.5rem;
    backdrop-filter: blur(6px);
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--silver);
    margin-bottom: 1.5rem;
  }
  .status-msg.error { border-left-color: #ef9a9a; color: #ef9a9a; }

  .roster-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--gold);
    border-radius: 6px;
    padding: 1.25rem;
    backdrop-filter: blur(6px);
    display: none;
  }
  .roster-card.active { display: block; }

  .roster-header {
    border-bottom: 2px solid rgba(240,192,48,0.3);
    padding-bottom: 0.75rem;
    margin-bottom: 1rem;
  }

  .roster-title {
    font-family: 'Oswald', sans-serif;
    font-size: 1.2rem;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .roster-number {
    background: rgba(240,192,48,0.15);
    border: 1px solid rgba(240,192,48,0.5);
    color: var(--gold);
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .player-count {
    color: var(--silver);
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 400;
    margin-top: 2px;
  }

  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 1rem;
    grid-auto-flow: dense;
  }

  .player-section {
    padding: 0.85rem 1rem;
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    border-left: 3px solid var(--blue-accent);
    height: fit-content;
  }

  .player-info {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
  }

  .player-name {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--white);
  }

  .player-meta {
    display: flex;
    gap: 0.4rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .position-badge {
    background: rgba(41,128,185,0.25);
    border: 1px solid rgba(41,128,185,0.5);
    color: #7ec8e3;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 600;
  }

  .team-badge {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--silver);
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 600;
  }

  .player-id { color: rgba(255,255,255,0.28); font-size: 0.65rem; }

  .transactions { margin-top: 0.5rem; }

  .transaction {
    display: flex;
    align-items: center;
    padding: 5px 7px;
    margin: 3px 0;
    background: rgba(0,0,0,0.2);
    border-radius: 4px;
    font-size: 0.75rem;
    gap: 6px;
    flex-wrap: wrap;
  }

  .transaction-week {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    color: var(--gold);
    min-width: 80px;
  }

  .transaction-type {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 600;
    min-width: 85px;
    text-align: center;
  }

  .type-draft     { background: rgba(25,118,210,0.2);  color: #64b5f6; border: 1px solid rgba(100,181,246,0.3); }
  .type-trade-in  { background: rgba(56,142,60,0.2);   color: #81c784; border: 1px solid rgba(129,199,132,0.3); }
  .type-trade-out { background: rgba(211,47,47,0.2);   color: #ef9a9a; border: 1px solid rgba(239,154,154,0.3); }
  .type-waiver    { background: rgba(245,124,0,0.2);   color: #ffb74d; border: 1px solid rgba(255,183,77,0.3); }
  .type-fa        { background: rgba(123,31,162,0.2);  color: #ce93d8; border: 1px solid rgba(206,147,216,0.3); }
  .type-drop      { background: rgba(198,40,40,0.2);   color: #ff8a80; border: 1px solid rgba(255,138,128,0.3); }

  .transaction-details { color: var(--silver); font-size: 0.9em; }

  .no-transactions {
    color: rgba(255,255,255,0.28);
    font-style: italic;
    padding: 0.5rem;
    font-size: 0.75rem;
  }

  .transaction-count {
    font-family: 'Oswald', sans-serif;
    color: var(--gold);
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    margin-top: 0.5rem;
    text-align: right;
  }
  /* ---- SITE NAV ---- */
  .site-nav {
    background: rgba(10,25,10,0.95);
    border-bottom: 2px solid rgba(240,192,48,0.25);
    padding: 0.65rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
    margin: -20px -20px 1.5rem;
  }
  .site-nav-brand {
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--gold);
    text-decoration: none;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .site-nav-links { display: flex; gap: 0.15rem; flex-wrap: wrap; align-items: center; }
  .site-nav-links a {
    font-family: 'Oswald', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--silver);
    text-decoration: none;
    padding: 0.3rem 0.75rem 0.2rem;
    border-bottom: 2px solid transparent;
    transition: color 0.2s;
  }
  .site-nav-links a:hover { color: var(--white); }
  .site-nav-links a.active { color: var(--gold); border-bottom-color: rgba(240,192,48,0.7); }
</style>
</head>
<body>
<nav class="site-nav">
  <a class="site-nav-brand" href="index.html">🏈 Boys Club FFL</a>
  <div class="site-nav-links">
    <a href="index.html">Home</a>
    <a href="CommishNote.html">Commish Note</a>
    <a href="Fantasy-Football-Keeper-Rules.html" class="active">Keeper Rules</a>
    <a href="keeper-calculator.html">2027 Keeper Calculator</a>
    <a href="dashboard.html">Current Roster</a>
  </div>
</nav>
<div class="container">
  <header>
    <h1>🏈 Boys Club FFL</h1>
    <p class="subtitle">Transaction History Dashboard</p>
  </header>

  <div class="team-selector">
    <div class="selector-label">Select Team:</div>
    <select id="teamSelect" onchange="switchTeam()">
      <option>Loading...</option>
    </select>
  </div>

  <div id="status" class="status-msg">⏳ Fetching league data from Sleeper...</div>
  <div id="roster-container"></div>
</div>

<script>
  const LEAGUE_ID = '1385115148011716609';
  const API = 'https://api.sleeper.app/v1';
  const PLAYERS_CACHE_KEY = 'sleeper_players_v2';
  const PLAYERS_CACHE_TS  = 'sleeper_players_ts_v2';
  const CACHE_TTL = 86400000; // 24h

  let playersDB = {};
  let rosterUserMap = {};
  let playerHistory = {};

  function setStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status-msg' + (isError ? ' error' : '');
    el.style.display = 'block';
  }

  function hideStatus() {
    document.getElementById('status').style.display = 'none';
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status} — ${url}`);
    return res.json();
  }

  async function getPlayers() {
    const cached = localStorage.getItem(PLAYERS_CACHE_KEY);
    const ts     = localStorage.getItem(PLAYERS_CACHE_TS);
    if (cached && ts && Date.now() - Number(ts) < CACHE_TTL) {
      return JSON.parse(cached);
    }
    setStatus('⏳ Downloading player database (one-time, ~5MB)...');
    const data = await fetchJson(`${API}/players/nfl`);
    try {
      localStorage.setItem(PLAYERS_CACHE_KEY, JSON.stringify(data));
      localStorage.setItem(PLAYERS_CACHE_TS, String(Date.now()));
    } catch (_) {}
    return data;
  }

  function addHistory(playerId, week, type, detail) {
    if (!playerHistory[playerId]) playerHistory[playerId] = [];
    playerHistory[playerId].push({ week, type, detail });
  }

  function typeClass(type) {
    const map = {
      'DRAFTED':     'type-draft',
      'TRADED TO':   'type-trade-in',
      'TRADED FROM': 'type-trade-out',
      'WAIVER ADD':  'type-waiver',
      'FA ADD':      'type-fa',
      'DROPPED':     'type-drop',
    };
    return map[type] || '';
  }

  async function init() {
    try {
      setStatus('⏳ Loading player database...');
      const players = await getPlayers();
      playersDB = players;

      setStatus('⏳ Fetching league info...');
      const [users, rosters, drafts] = await Promise.all([
        fetchJson(`${API}/league/${LEAGUE_ID}/users`),
        fetchJson(`${API}/league/${LEAGUE_ID}/rosters`),
        fetchJson(`${API}/league/${LEAGUE_ID}/drafts`),
      ]);

      // Maps
      const userMap = Object.fromEntries(
        users.map(u => [u.user_id, u.display_name || u.username])
      );
      rosters.forEach(r => {
        rosterUserMap[r.roster_id] = userMap[r.owner_id] || `Roster ${r.roster_id}`;
      });

      // Draft picks
      setStatus('⏳ Fetching draft picks...');
      for (const draft of drafts) {
        const picks = await fetchJson(`${API}/draft/${draft.draft_id}/picks`);
        picks.forEach(pick => {
          if (!pick.player_id) return;
          const team = rosterUserMap[pick.roster_id] || `Roster ${pick.roster_id}`;
          addHistory(pick.player_id, 0, 'DRAFTED',
            `Round ${pick.round}, Pick ${pick.pick_no} by ${team}`);
        });
      }

      // Transactions weeks 1–18
      setStatus('⏳ Fetching transactions (weeks 1–18)...');
      const txWeeks = await Promise.all(
        Array.from({ length: 18 }, (_, i) =>
          fetchJson(`${API}/league/${LEAGUE_ID}/transactions/${i + 1}`).catch(() => [])
        )
      );

      txWeeks.forEach((weekTxs, idx) => {
        const week = idx + 1;
        if (!Array.isArray(weekTxs)) return;
        weekTxs.forEach(tx => {
          if (tx.status !== 'complete') return;
          const adds  = tx.adds  || {};
          const drops = tx.drops || {};

          if (tx.type === 'trade') {
            Object.entries(adds).forEach(([pid, toId]) => {
              const fromId = drops[pid];
              const toTeam   = rosterUserMap[toId]   || `Roster ${toId}`;
              const fromTeam = fromId ? (rosterUserMap[fromId] || `Roster ${fromId}`) : '?';
              addHistory(pid, week, 'TRADED TO',   toTeam);
              addHistory(pid, week, 'TRADED FROM', fromTeam);
            });
          } else {
            Object.entries(adds).forEach(([pid, rosterId]) => {
              const team = rosterUserMap[rosterId] || `Roster ${rosterId}`;
              addHistory(pid, week, tx.type === 'waiver' ? 'WAIVER ADD' : 'FA ADD', team);
            });
            Object.entries(drops).forEach(([pid, rosterId]) => {
              if (adds[pid]) return;
              const team = rosterUserMap[rosterId] || `Roster ${rosterId}`;
              addHistory(pid, week, 'DROPPED', `from ${team}`);
            });
          }
        });
      });

      setStatus('⏳ Rendering...');
      buildUI(rosters);
      hideStatus();

    } catch (err) {
      setStatus(`Error: ${err.message}`, true);
    }
  }

  function buildUI(rosters) {
    const select    = document.getElementById('teamSelect');
    const container = document.getElementById('roster-container');
    select.innerHTML    = '';
    container.innerHTML = '';

    rosters
      .sort((a, b) => a.roster_id - b.roster_id)
      .forEach((roster, idx) => {
        const name    = rosterUserMap[roster.roster_id];
        const players = [...(roster.players || []), ...(roster.reserve || [])];

        // Dropdown option
        const opt = document.createElement('option');
        opt.value       = roster.roster_id;
        opt.textContent = `Roster ${roster.roster_id} — ${name} (${players.length} players)`;
        if (idx === 0) opt.selected = true;
        select.appendChild(opt);

        // Card
        const card = document.createElement('div');
        card.className = 'roster-card' + (idx === 0 ? ' active' : '');
        card.id        = `roster-${roster.roster_id}`;

        const header = document.createElement('div');
        header.className = 'roster-header';
        header.innerHTML = `
          <div class="roster-title">
            <div class="roster-number">${roster.roster_id}</div>
            <div>
              <div>${name}</div>
              <div class="player-count">${players.length} players</div>
            </div>
          </div>`;

        const grid = document.createElement('div');
        grid.className = 'players-grid';

        players.forEach(pid => {
          const p      = playersDB[pid] || {};
          const pName  = p.full_name
            || (`${p.first_name || ''} ${p.last_name || ''}`).trim()
            || `Player ${pid}`;
          const pos    = p.position || '—';
          const nflTeam = p.team || 'FA';
          const history = (playerHistory[pid] || [])
            .sort((a, b) => a.week - b.week);

          const txRows = history.length === 0
            ? `<div class="no-transactions">No transactions found</div>`
            : history.map(h => {
                const weekLabel = h.week === 0 ? 'Week 0 (Draft)' : `Week ${h.week}`;
                return `<div class="transaction">
                  <span class="transaction-week">${weekLabel}</span>
                  <span class="transaction-type ${typeClass(h.type)}">${h.type}</span>
                  <span class="transaction-details">${h.detail}</span>
                </div>`;
              }).join('')
              + `<div class="transaction-count">Total: ${history.length} transaction(s)</div>`;

          const section = document.createElement('div');
          section.className = 'player-section';
          section.innerHTML = `
            <div class="player-info">
              <div class="player-name">${pName}</div>
              <div class="player-meta">
                <span class="position-badge">${pos}</span>
                <span class="team-badge">${nflTeam}</span>
                <span class="player-id">ID: ${pid}</span>
              </div>
            </div>
            <div class="transactions">${txRows}</div>`;
          grid.appendChild(section);
        });

        card.appendChild(header);
        card.appendChild(grid);
        container.appendChild(card);
      });
  }

  function switchTeam() {
    const val = document.getElementById('teamSelect').value;
    document.querySelectorAll('.roster-card').forEach(c => c.classList.remove('active'));
    const target = document.getElementById(`roster-${val}`);
    if (target) target.classList.add('active');
  }

  init();
</script>
</body>
</html>
